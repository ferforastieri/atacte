services:
  postgres:
    image: postgres:15-alpine
    container_name: atacte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atacte}
      POSTGRES_USER: ${POSTGRES_USER:-atacte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - atacte-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-atacte} -d ${POSTGRES_DB:-atacte}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/ferforastieri/atacte-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: atacte-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atacte}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atacte}?sslmode=disable
      PORT: 3001
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-500}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-5}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      MUTATION_RATE_LIMIT_MAX: ${MUTATION_RATE_LIMIT_MAX:-120}
      MUTATION_RATE_LIMIT_WINDOW_MS: ${MUTATION_RATE_LIMIT_WINDOW_MS:-60000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_MAX_AGE_MS: ${COOKIE_MAX_AGE_MS:-2592000000}
      JWT_ISSUER: ${JWT_ISSUER:-atacte-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-atacte-clients}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Atacte}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-}
      UPDATER_URL: ${UPDATER_URL:-http://atacte-updater:8080}
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3457}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - atacte-network

  front:
    image: ${FRONT_IMAGE:-ghcr.io/ferforastieri/atacte-frontend:latest}
    build:
      context: .
      dockerfile: Dockerfile.front
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: atacte-front
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-3456}:80"
    depends_on:
      - backend
    networks:
      - atacte-network

  updater:
    image: ${UPDATER_IMAGE:-atacte-updater:local}
    build:
      context: ./updater
    container_name: atacte-updater
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=16m"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      ATACTE_INSTALL_DIR: ${ATACTE_INSTALL_DIR:-/workspace}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace:rw
    networks:
      - atacte-network

networks:
  atacte-network:
    driver: bridge

volumes:
  postgres_data:

name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  publish:
    name: Build ${{ matrix.image }} (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            image_name: atacte-backend
            context: .
            dockerfile: Dockerfile.backend
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - image: backend
            image_name: atacte-backend
            context: .
            dockerfile: Dockerfile.backend
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: frontend
            image_name: atacte-frontend
            context: .
            dockerfile: Dockerfile.front
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - image: frontend
            image_name: atacte-frontend
            context: .
            dockerfile: Dockerfile.front
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: updater
            image_name: atacte-updater
            context: updater
            dockerfile: updater/Dockerfile
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - image: updater
            image_name: atacte-updater
            context: updater
            dockerfile: updater/Dockerfile
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: image-meta
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5.9.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=arch-${{ matrix.architecture }}-${{ github.sha }}
      - name: Build and publish image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            VITE_API_URL=/api
            VITE_BUILD_VERSION=${{ github.sha }}
          tags: ${{ steps.image-meta.outputs.tags }}
          labels: ${{ steps.image-meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.architecture }}
          sbom: true
          provenance: mode=max

  manifest:
    name: Publish multi-architecture manifests
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifests
        env:
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/atacte-backend
          FRONTEND_IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/atacte-frontend
          UPDATER_IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/atacte-updater
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          backend_sources="${BACKEND_IMAGE}:arch-amd64-${COMMIT_SHA} ${BACKEND_IMAGE}:arch-arm64-${COMMIT_SHA}"
          frontend_sources="${FRONTEND_IMAGE}:arch-amd64-${COMMIT_SHA} ${FRONTEND_IMAGE}:arch-arm64-${COMMIT_SHA}"
          updater_sources="${UPDATER_IMAGE}:arch-amd64-${COMMIT_SHA} ${UPDATER_IMAGE}:arch-arm64-${COMMIT_SHA}"

          backend_tags="${BACKEND_IMAGE}:sha-${COMMIT_SHA}"
          frontend_tags="${FRONTEND_IMAGE}:sha-${COMMIT_SHA}"
          updater_tags="${UPDATER_IMAGE}:sha-${COMMIT_SHA}"
          if [ "$REF_TYPE" = "branch" ] && [ "$REF_NAME" = "main" ]; then
            backend_tags="$backend_tags ${BACKEND_IMAGE}:latest"
            frontend_tags="$frontend_tags ${FRONTEND_IMAGE}:latest"
            updater_tags="$updater_tags ${UPDATER_IMAGE}:latest"
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            backend_tags="$backend_tags ${BACKEND_IMAGE}:${REF_NAME}"
            frontend_tags="$frontend_tags ${FRONTEND_IMAGE}:${REF_NAME}"
            updater_tags="$updater_tags ${UPDATER_IMAGE}:${REF_NAME}"
          fi

          for tag in $backend_tags; do
            docker buildx imagetools create --tag "$tag" $backend_sources
          done
          for tag in $frontend_tags; do
            docker buildx imagetools create --tag "$tag" $frontend_sources
          done
          for tag in $updater_tags; do
            docker buildx imagetools create --tag "$tag" $updater_sources
          done

  mobile:
    name: Expo Android (non-blocking)
    continue-on-error: true
    # Temporarily disabled while the Expo/EAS pipeline is paused. Keeping the
    # job and its output preserves the release workflow without building an APK.
    env:
      EXPO_BUILD_ENABLED: 'false'
    outputs:
      apk_available: ${{ steps.apk_status.outputs.available }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Detect Expo credentials
        id: expo_token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ "$EXPO_BUILD_ENABLED" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=$([ -n \"$EXPO_TOKEN\" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          fi
      - name: Install mobile dependencies
        if: ${{ env.EXPO_BUILD_ENABLED == 'true' && steps.expo_token.outputs.enabled == 'true' }}
        working-directory: mobile
        run: npm ci
      - name: Build Android with EAS
        id: eas
        if: ${{ env.EXPO_BUILD_ENABLED == 'true' && steps.expo_token.outputs.enabled == 'true' }}
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set +e
          # Wait for the remote EAS build so the generated APK can be
          # downloaded and attached to the GitHub release automatically.
          npx --yes eas-cli@latest build --platform android --profile production --non-interactive --wait --json > eas-build.json
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "EAS falhou; publicação do backend/web continua." >&2
            exit 0
          fi
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('eas-build.json','utf8')); const b=Array.isArray(x)?x[0]:x; const url=b?.artifacts?.buildUrl || b?.artifacts?.applicationArchiveUrl; if(!url) process.exit(2); fs.writeFileSync('apk-url.txt',url)"
          url="$(cat apk-url.txt)"
          curl --fail --location --retry 3 "$url" -o atacte-android.apk
          test -s atacte-android.apk
      - name: Upload APK artifact
        if: ${{ env.EXPO_BUILD_ENABLED == 'true' && steps.expo_token.outputs.enabled == 'true' && hashFiles('mobile/atacte-android.apk') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atacte-android-apk
          path: mobile/atacte-android.apk
      - name: Record APK availability
        id: apk_status
        if: ${{ always() }}
        run: echo "available=$([ -s mobile/atacte-android.apk ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [manifest, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.0.${{ github.run_number }}
        run: |
          chmod +x web/public/install.sh
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Atacte $RELEASE_TAG" \
              --notes $'Instalação rápida:\n\n```bash\ncurl -fsSL https://atacte.vercel.app/install.sh | sh\n```' \
              --generate-notes \
              docker-compose.yml README.md LICENSE web/public/install.sh updater/Dockerfile updater/go.mod updater/go.sum updater/main.go
          fi
      - name: Download APK artifact when available
        if: ${{ always() && needs.mobile.outputs.apk_available == 'true' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: atacte-android-apk
          path: mobile-release
      - name: Attach APK to release
        if: ${{ hashFiles('mobile-release/atacte-android.apk') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.0.${{ github.run_number }}
        run: gh release upload "$RELEASE_TAG" mobile-release/atacte-android.apk --clobber

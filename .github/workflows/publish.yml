name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata backend
        id: backend-meta
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5.9.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/atacte-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=long,prefix=sha-
      - name: Build backend image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BUILD_VERSION=${{ github.sha }}
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          sbom: true
          provenance: mode=max
      - name: Metadata frontend
        id: frontend-meta
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5.9.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/atacte-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=long,prefix=sha-
      - name: Build frontend image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: Dockerfile.front
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_API_URL=/api
            VITE_BUILD_VERSION=${{ github.sha }}
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          sbom: true
          provenance: mode=max

  mobile:
    name: Expo Android (non-blocking)
    continue-on-error: true
    outputs:
      apk_available: ${{ steps.apk_status.outputs.available }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Detect Expo credentials
        id: expo_token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: echo "enabled=$([ -n \"$EXPO_TOKEN\" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Install mobile dependencies
        if: ${{ steps.expo_token.outputs.enabled == 'true' }}
        working-directory: mobile
        run: npm ci
      - name: Build Android with EAS
        id: eas
        if: ${{ steps.expo_token.outputs.enabled == 'true' }}
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set +e
          npx --yes eas-cli@latest build --platform android --profile production --non-interactive --wait --json > eas-build.json
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "EAS falhou; publicação do backend/web continua." >&2
            exit 0
          fi
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('eas-build.json','utf8')); const b=Array.isArray(x)?x[0]:x; const url=b?.artifacts?.buildUrl || b?.artifacts?.applicationArchiveUrl; if(!url) process.exit(2); fs.writeFileSync('apk-url.txt',url)"
          url="$(cat apk-url.txt)"
          curl --fail --location --retry 3 "$url" -o atacte-android.apk
          test -s atacte-android.apk
      - name: Upload APK artifact
        if: ${{ steps.expo_token.outputs.enabled == 'true' && hashFiles('mobile/atacte-android.apk') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atacte-android-apk
          path: mobile/atacte-android.apk
      - name: Record APK availability
        id: apk_status
        if: ${{ always() }}
        run: echo "available=$([ -s mobile/atacte-android.apk ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish, mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.0.${{ github.run_number }}
        run: |
          chmod +x web/public/install.sh
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Atacte $RELEASE_TAG" --notes $'Instalação rápida:\n\n```bash\ncurl -fsSL https://atacte.vercel.app/install.sh | sh\n```' --generate-notes docker-compose.yml README.md web/public/install.sh updater/Dockerfile updater/go.mod updater/go.sum updater/main.go
      - name: Download APK artifact when available
        if: ${{ always() && needs.mobile.outputs.apk_available == 'true' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: atacte-android-apk
          path: mobile-release
      - name: Attach APK to release
        if: ${{ hashFiles('mobile-release/atacte-android.apk') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.0.${{ github.run_number }}
        run: gh release upload "$RELEASE_TAG" mobile-release/atacte-android.apk --clobber

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Install web
        working-directory: web
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npm run db:generate
      - name: Typecheck backend
        working-directory: backend
        run: npx tsc --noEmit
      - name: Test backend
        working-directory: backend
        run: npm test
      - name: Build web artifacts
        working-directory: web
        run: npm run build
      - name: Validate Compose
        run: docker compose config
      - name: Test updater
        working-directory: updater
        run: go test ./...
      - name: Dependency audit backend
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit web
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: Check generated files for secrets
        run: '! rg -n "JWT_SECRET=|ENCRYPTION_KEY=|POSTGRES_PASSWORD=|Bearer [A-Za-z0-9._-]{20,}" web/dist-* 2>/dev/null'

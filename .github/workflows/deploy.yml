name: Deploy self-hosted

on:
  workflow_run:
    workflows: [Publish]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          printf 'DEPLOY_SSH_HOST=%s\nDEPLOY_SSH_USER=%s\n' "$SSH_HOST" "$SSH_USER" >> "$GITHUB_ENV"
      - name: Pull and restart immutable images
        env:
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/atacte-backend:sha-${{ github.event.workflow_run.head_sha }}
          FRONT_IMAGE: ghcr.io/${{ github.repository_owner }}/atacte-frontend:sha-${{ github.event.workflow_run.head_sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -eu
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "echo '$GHCR_TOKEN' | docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin >/dev/null"
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "BACKEND_IMAGE='$BACKEND_IMAGE' FRONT_IMAGE='$FRONT_IMAGE' bash -s" <<'REMOTE'
          set -eu
          cd /opt/atacte
          old_backend="$(docker inspect --format '{{.Config.Image}}' atacte-backend 2>/dev/null || true)"
          old_front="$(docker inspect --format '{{.Config.Image}}' atacte-front 2>/dev/null || true)"
          docker compose pull
          docker compose up -d --remove-orphans
          healthy=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:${BACKEND_PORT:-3457}/health >/dev/null && curl --fail --silent --show-error http://127.0.0.1:${FRONT_PORT:-3456}/ >/dev/null; then healthy=1; break; fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            echo "health check falhou; restaurando imagens anteriores" >&2
            if [ -n "$old_backend" ] && [ -n "$old_front" ]; then BACKEND_IMAGE="$old_backend" FRONT_IMAGE="$old_front" docker compose up -d --remove-orphans; fi
            exit 1
          fi
          docker compose ps --format json
          REMOTE
